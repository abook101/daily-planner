<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner tests</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 16px; background: #111827; color: #f9fafb; }
    li { margin: 4px 0; }
    .pass { color: #22c55e; } .fail { color: #f87171; }
    .err { color: #fca5a5; font-size: 0.85rem; display: block; margin-left: 1.4em; }
    #summary { font-size: 1.2rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Planner tests</h1>
  <p class="muted">These use fake storage, so your real planner data is never touched.</p>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
  <script src="../js/store.js"></script>
  <script src="../js/plan.js"></script>
  <script src="../js/today.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/notify.js"></script>
  <script src="data.test.js"></script>
  <script src="plan.test.js"></script>
  <script src="today.test.js"></script>
  <script src="settings.test.js"></script>
  <script src="sync.test.js"></script>
  <script src="reminders.test.js"></script>
  <script src="notify.test.js"></script>
  <script>
    const ul = document.getElementById("results");
    function show(good, name, err) {
      const li = document.createElement("li");
      li.className = good ? "pass" : "fail";
      li.textContent = (good ? "✓ " : "✗ ") + name;
      if (err) { const s = document.createElement("span"); s.className = "err"; s.textContent = err; li.appendChild(s); }
      ul.appendChild(li);
    }
    function heading(text) { const h = document.createElement("h2"); h.textContent = text; ul.appendChild(h); }
    (async () => {
      heading("Data layer (store.js)");
      const a = await window.runDataTests(show);
      heading("Daily plan logic (plan.js)");
      const b = await window.runPlanTests(show);
      heading("Today screen helpers (today.js)");
      const c = await window.runTodayTests(show);
      heading("Settings (store.js + plan.js)");
      const e = await window.runSettingsTests(show);
      heading("Whoop laptop sync (sync.js)");
      const f = await window.runSyncTests(show);
      heading("Reminders (store.js)");
      const g = await window.runReminderTests(show);
      heading("Phone notifications (notify.js)");
      const n = await window.runNotifyTests(show);
      const all = [a, b, c, e, f, g, n];
      const passed = all.reduce((n, r) => n + r.passed, 0), failed = all.reduce((n, r) => n + r.failed, 0);
      const el = document.getElementById("summary");
      el.textContent = passed + " passed, " + failed + " failed";
      el.className = failed ? "fail" : "pass";
    })();
  </script>
</body>
</html>
