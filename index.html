<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Daily Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Today</h1>
        <p id="today-date" class="muted"></p>
      </div>
      <label class="switch" title="Low energy: minimal plan for today">
        <input id="low-energy" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span class="switch-text">Low energy</span>
      </label>
    </div>
    <div id="exam-strip" class="exam-strip" aria-label="Exam countdown"></div>
    <p id="low-energy-banner" class="banner" hidden>Low energy mode: the minimal plan for today. Switches off by itself tomorrow.</p>
    <button id="undo-pill" class="undo-pill" type="button" hidden></button>
  </header>

  <!-- The cards are filled in by js/app.js. -->
  <main id="app">
    <section class="card" id="card-metrics"></section>
    <section class="card" id="card-training"></section>
    <section class="card" id="card-study"></section>
    <section class="card" id="card-chores"></section>

    <section class="card" id="card-backup">
      <h2>Backup</h2>
      <p class="muted">Your data lives only on this phone. Export a backup now and then.</p>
      <div class="btn-row">
        <button id="export-btn" type="button">Export backup</button>
        <button id="import-btn" type="button" class="secondary">Import backup</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="backup-status" class="muted small"></p>
    </section>
  </main>

  <footer class="bottom muted">
    <span id="offline-status">Checking offline support…</span>
  </footer>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" type="button" class="link">Undo</button>
  </div>

  <script src="js/store.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/today.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
