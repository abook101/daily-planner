<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Daily Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <h1>Today</h1>
    <p id="today-date" class="muted"></p>
  </header>

  <main id="app">
    <!-- Placeholder cards. Later steps fill these in. -->
    <section class="card" id="card-suggestion">
      <h2>Today's training</h2>
      <p class="muted">Run / gym / rest suggestion from Whoop goes here (step 3).</p>
    </section>

    <section class="card" id="card-study">
      <h2>Study</h2>
      <p class="muted">45-min study blocks and exam countdowns go here (step 4).</p>
    </section>

    <section class="card" id="card-chores">
      <h2>Chores</h2>
      <p class="muted">Chores that are due today go here (step 4).</p>
    </section>
  </main>

  <footer class="bottom muted">
    <span id="offline-status">Checking offline support…</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
